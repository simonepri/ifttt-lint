# CI/CD Pipeline
#
# On every push to main and on PRs: runs lint, test, and bench in parallel.
#
# On push to main only (after all CI jobs pass): the release job runs release-plz, which:
#   1. Reads conventional commit messages since the last release (feat: → minor, fix: → patch, feat!: → major).
#   2. Creates or updates a release PR that bumps the version in Cargo.toml and updates the changelog.
#   3. If a version is already tagged and ready (from a previously merged release PR), publishes to
#      crates.io and creates a GitHub Release.
#   4. If step 3 released, upload-binaries attaches prebuilt linux and macOS binaries to that release.
#
# The binaries are built in this same run rather than in a tag-triggered workflow because release-plz
# tags with GITHUB_TOKEN, and GitHub does not fire workflow events for GITHUB_TOKEN actions — so
# `on: push: tags:` would never start. Gating on the release job's output keeps this working without
# a PAT or GitHub App token.
#
# The only manual step is merging the release PR — everything else is automatic.
#
# Required secrets: CARGO_REGISTRY_TOKEN (for crates.io). GITHUB_TOKEN is provided by GitHub Actions.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: pre-commit run --all-files

  action:
    name: IfThisThenThat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  bench:
    name: Bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: release
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed
      - name: Build benchmarks
        run: cargo codspeed build --features test-util --bench check_bench
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Update pre-commit hook version in readme
        env:
          PRS: ${{ steps.release-pr.outputs.prs }}
        run: |
          BRANCH=$(echo "$PRS" | jq -r '.[0].head_branch // empty')
          [ -z "$BRANCH" ] && exit 0

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # LINT.IfChange(version)
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # LINT.ThenChange(//Cargo.toml:version, //readme.md:version-pre-commit, //readme.md:version-github-action)
          sed -i "s|rev: v[0-9][0-9.]*|rev: v${VERSION}|" readme.md
          sed -i "s|ifttt-lint@v[0-9][0-9.]*|ifttt-lint@v${VERSION}|g" readme.md

          if ! git diff --quiet readme.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add readme.md
            git commit --amend --no-edit
            git push --force-with-lease origin "$BRANCH"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  upload-binaries:
    name: Upload ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      # The crate is already published by this point, so a single broken target
      # should still leave every other archive attached to the release.
      fail-fast: false
      matrix:
        include:
          # Every target builds natively — ubuntu-*-arm and macOS runners avoid
          # needing a cross linker. ubuntu-22.04 sets the glibc floor at 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ fromJSON(needs.release.outputs.releases)[0].tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ifttt-lint
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          ref: refs/tags/${{ fromJSON(needs.release.outputs.releases)[0].tag }}
